name: Home Assistant next

# Every week, run the Python checks against the newest Home Assistant release
# and the current beta, so a breaking change shows up before users update.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the ${{ matrix.channel }} Home Assistant
        run: >-
          python -m pip install --disable-pip-version-check
          ${{ matrix.channel == 'beta' && '--pre' || '' }}
          pytest-homeassistant-custom-component mypy ruff
      - name: Home Assistant version
        id: version
        run: echo "ha=$(python -c 'from homeassistant.const import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Type check
        run: mypy custom_components
      - name: Test
        run: pytest -q
      - name: Report a failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Home Assistant ${{ steps.version.outputs.ha }} breaks Schedule Creator checks"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q .; then
            exit 0
          fi
          gh issue create --title "$TITLE" --body "The weekly check against Home Assistant ${{ steps.version.outputs.ha }} (${{ matrix.channel }}) failed: $RUN"
