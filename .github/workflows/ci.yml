name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frontend
        working-directory: frontend
        run: npm run build && npm test
      - name: Check shipped bundle
        run: git diff --exit-code -- custom_components/schedule_creator/frontend/

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          ignore: topics description

  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install checks
        run: >-
          python -m pip install --disable-pip-version-check
          pytest-homeassistant-custom-component==0.13.365 mypy ruff
      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components
          python -m json.tool \
            custom_components/schedule_creator/manifest.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          for file in custom_components/schedule_creator/translations/*.json; do
            python -m json.tool "$file" >/dev/null
          done
      - name: Lint
        run: ruff check custom_components tests
      - name: Type check core
        run: mypy custom_components
      - name: Test
        run: pytest -q
