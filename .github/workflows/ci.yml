name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install checks
        run: python -m pip install --disable-pip-version-check ruff
      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components
          python -m json.tool custom_components/schedule_creator/manifest.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          for file in custom_components/schedule_creator/translations/*.json; do
            python -m json.tool "$file" >/dev/null
          done
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: python -m unittest discover -s tests -v
