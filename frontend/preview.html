<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Creator · anteprima grafica</title>
<style>body{margin:0;padding:32px 16px;background:#eef2f5;font-family:Arial,sans-serif;color:#202a35;--primary-color:#00897b;--text-primary-color:#fff}body.dark{background:#10171e;color:#e4eaf0;--card-background-color:#1b242e;--secondary-background-color:#232f3b;--primary-text-color:#e4eaf0;--secondary-text-color:#acb9c7;--divider-color:#384654;--primary-color:#56c7b5;--text-primary-color:#102722}main{max-width:1000px;margin:auto}.preview-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;gap:12px}.preview-tools button{background:transparent;color:inherit;border:1px solid #82919c;border-radius:8px;padding:9px;cursor:pointer}schedule-creator-card{--ha-card-border-radius:20px}</style>
<main><div class="preview-tools"><span>ANTEPRIMA · dati dimostrativi, nessun dispositivo collegato</span><button onclick="document.body.classList.toggle('dark')">Tema chiaro / scuro</button></div><schedule-creator-card></schedule-creator-card><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px"><schedule-creator-timeline-card id="tl" style="grid-column:1/-1"></schedule-creator-timeline-card><schedule-creator-serpentine-card id="sp" style="grid-column:1/-1"></schedule-creator-serpentine-card><schedule-creator-ring-card id="rg" style="grid-column:1/-1"></schedule-creator-ring-card><schedule-creator-quick-timer-card id="qt1"></schedule-creator-quick-timer-card><schedule-creator-quick-timer-card id="qt2"></schedule-creator-quick-timer-card></div></main>
<script src="../custom_components/schedule_creator/frontend/schedule-creator-card.js"></script>
<script>
const profiles=[{id:'home',name:'A casa',active:true,profile_type:'shared',color:'#00897b'},{id:'away',name:'Fuori casa',active:false,profile_type:'exclusive',color:'#6177c8'},{id:'night',name:'Notte',active:false,profile_type:'shared',color:'#9774b5'}];
const groups=[{id:'living',profile_id:'home',name:'Soggiorno',entity_ids:['light.sofa','switch.lamp']},{id:'bedroom',profile_id:'home',name:'Camera',entity_ids:['climate.bedroom','cover.bedroom']},{id:'garden',profile_id:'home',name:'Giardino',entity_ids:['switch.garden']}];
const schedule=(id,name,entity,start,end,days)=>({id,name,profile_id:'home',group_id:'living',enabled:true,target_entity_ids:[entity],time_slots:[{weekdays:days,start,end}],start_action:{domain:entity.split('.')[0],action:'turn_on',data:{}},end_action:{domain:entity.split('.')[0],action:'turn_off',data:{}},condition:null,override_policy:'cooperative',inclusion_dates:[],exclusion_dates:[],start_notification:null,end_notification:null});
const state={revision:1,integration_version:'0.3.17',config:{profiles,groups,schedules:[schedule('morning','Un risveglio tranquillo','switch.lamp','07:00','08:30',[0,1,2,3,4]),schedule('late','Lettura notturna','switch.lamp','22:30','01:30',[4,5]),schedule('evening','Luci della sera','light.sofa','00:00','23:59',[0,1,2,3,4,5,6]),{...schedule('ac','Fresco pomeriggio','climate.bedroom','13:00','17:00',[0,1,2,3,4]),group_id:'bedroom',start_action:{domain:'climate',action:'apply_state',data:{state:'cool',temperature:23,fan_mode:'quiet'}},end_action:{domain:'climate',action:'apply_state',data:{state:'off'}}},{...schedule('acw','Caldo weekend','climate.bedroom','09:00','12:30',[5,6]),group_id:'bedroom',start_action:{domain:'climate',action:'apply_state',data:{state:'heat',temperature:27}}},{...schedule('tenda','Tenda contro il sole','cover.bedroom','10:00','18:00',[0,1,2,3,4,5,6]),group_id:'bedroom',start_action:{domain:'cover',action:'close_cover',data:{}},end_action:{domain:'cover',action:'open_cover',data:{}},condition:{operator:'numeric_greater',entity_id:'sensor.lux_esterna',value:500,lower:null,upper:null,children:[],minimum_duration_seconds:600,hysteresis:100,release_delay_seconds:900}}]},runtime_summary:{revision:1},operational:{occurrences:[{id:'o1',schedule_id:'evening',state:'active',condition_branch:'true',end_utc:new Date(Date.now()+3600000).toISOString()},{id:'o2',schedule_id:'ac',state:'active',condition_branch:'false',end_utc:new Date(Date.now()+5400000).toISOString()}],leases:[]},quick_timers:[{id:'t1',entity_id:'switch.garden',state:'active',expires_at:new Date(Date.now()+2520000).toISOString(),action:{domain:'switch',action:'turn_on',data:{}}}]};
const entities={'light.sofa':{friendly_name:'Luce divano',supported_color_modes:['rgb']},'switch.lamp':{friendly_name:'Lampada da lettura'},'climate.bedroom':{friendly_name:'AC Camera',hvac_modes:['off','auto','cool','heat','dry','fan_only'],fan_modes:['auto','quiet','low','medium_low','medium','medium_high','high'],preset_modes:['power_50','power_75','power_100'],swing_modes:['off','swing_vertical','swing_horizontal','fixed_1','fixed_2'],fan_mode:'quiet',temperature:23,min_temp:17,max_temp:30,target_temp_step:1,supported_features:57},'cover.bedroom':{friendly_name:'Tenda camera',supported_features:15,current_position:40},'switch.garden':{friendly_name:'Luci giardino'},'sensor.temp_camera':{friendly_name:'Temperatura camera',unit_of_measurement:'°C'},'binary_sensor.finestra':{friendly_name:'Finestra camera',device_class:'window'},'sensor.lux_esterna':{friendly_name:'Luce esterna',unit_of_measurement:'lx'}};
// #lang=en|fr|de|es shows the interface and the demo names in that language.
const LANG=new URLSearchParams(location.hash.slice(1)).get('lang')||'it';
const DEMO_EN={'Caldo weekend':'Warm weekend','Fresco pomeriggio':'Cool afternoon','Lettura notturna':'Night reading','Luci della sera':'Evening lights','Tenda contro il sole':'Sun blind','Un risveglio tranquillo':'Gentle wake-up','AC Camera':'Bedroom AC','Finestra camera':'Bedroom window','Lampada da lettura':'Reading lamp','Luce divano':'Sofa light','Luce esterna':'Outdoor light','Luci giardino':'Garden lights','Temperatura camera':'Bedroom temperature','Tenda camera':'Bedroom blind','A casa':'Home','Camera':'Bedroom','Fuori casa':'Away','Giardino':'Garden','Notte':'Night','Soggiorno':'Living room'};
if(LANG!=='it'){const rename=(o)=>{for(const k of ['name','friendly_name']) if(o&&DEMO_EN[o[k]]) o[k]=DEMO_EN[o[k]];};[...profiles,...groups,...state.config.schedules].forEach(rename);Object.values(entities).forEach(rename);}
const card=document.querySelector('schedule-creator-card');card.setConfig({title:'Schedule Creator'});card.hass={language:LANG,user:{is_admin:true},config:{time_zone:'Europe/Rome'},states:Object.fromEntries(Object.entries(entities).map(([entity_id,attributes])=>[entity_id,{entity_id,attributes,state:'off'}])),services:{light:{turn_on:{},turn_off:{}},switch:{turn_on:{},turn_off:{}},climate:{set_temperature:{},set_hvac_mode:{}},cover:{open_cover:{},close_cover:{},set_cover_position:{}}},connection:{subscribeMessage:()=>Promise.resolve(()=>{}),sendMessagePromise:async(msg)=>{if(msg.type==='schedule_creator/get_state')return structuredClone(state);throw {code:'preview',message:'Anteprima: i salvataggi sono disabilitati.'};}}};
const qh=card._hass;Object.assign(qh.states['sensor.lux_esterna'],{state:'12400'});Object.assign(qh.states['sensor.temp_camera'],{state:'24.5'});Object.assign(qh.states['light.sofa'],{state:'on'});Object.assign(qh.states['cover.bedroom'],{state:'open'});const q1=document.getElementById('qt1');q1.setConfig({entity:'climate.bedroom'});q1.hass=qh;const tl=document.getElementById('tl');tl.setConfig({});tl.hass=qh;const sp=document.getElementById('sp');sp.setConfig({});sp.hass=qh;const rg=document.getElementById('rg');rg.setConfig({});rg.hass=qh;const q2=document.getElementById('qt2');q2.setConfig({});q2.hass=qh;
// Reproducible screenshots: preview.html#shot=main|editor|action|conditions|quicktimer|timeline|serpentine|ring
const shot=new URLSearchParams(location.hash.slice(1)).get('shot');
if(shot){
  document.querySelector('.preview-tools').style.display='none';document.body.style.padding='12px';document.documentElement.style.overflow='hidden';
  const only=(el)=>{for(const n of [card,tl,sp,rg,q1,q2]) n.style.display=n===el?'':'none';};
  const wait=(ms)=>new Promise((x)=>setTimeout(x,ms));
  setTimeout(async()=>{
    const r=card.shadowRoot;
    const camera=()=>{r.querySelector('[data-profile="home"]').click();r.querySelector('[data-group="bedroom"]').click();};
    if(shot==='main'){only(card);camera();}
    if(['editor','action','conditions'].includes(shot)){
      only(card);camera();await wait(50);
      r.querySelector(`[data-command="editSchedule"][data-id="${shot==='conditions'?'tenda':'ac'}"]`).click();await wait(150);
      const d=r.querySelector('dialog');
      const to=(node,offset)=>{d.scrollTop=node.getBoundingClientRect().top-d.getBoundingClientRect().top+d.scrollTop-offset;};
      if(shot==='action') to([...r.querySelectorAll('.sc-section-label')][1],70);
      if(shot==='conditions'){const row=r.querySelector('[data-section="row-conditions"]');row.open=true;await wait(50);to(row,70);}
    }
    if(shot==='quicktimer'){only(q1);q1.shadowRoot.querySelector('[name=timer_mode][value=cool]').click();}
    if(shot==='timeline') only(tl);
    if(shot==='serpentine') only(sp);
    if(shot==='ring') only(rg);
    document.body.dataset.ready='1';
  },400);
}
</script></html>
